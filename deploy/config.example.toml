# herdr-agent Node + pi configuration.
# Copy to ~/.herdr-agent/config.toml and chmod 600.
# Feishu credentials: setup writes FEISHU_APP_ID/FEISHU_APP_SECRET to .env.
# Credential precedence: process environment > state .env > repository .env.
# .env is literal KEY=VALUE: quotes and # are literal, not shell syntax.
# See docs/node-pi-design.md and README.zh-CN.md for lifecycle/migration semantics.

[feishu]
# setup records the verified owner. Empty means no Feishu control access;
# serve keeps local Web available for setup/diagnosis instead of allowing everyone.
allowed_open_ids = []
# Legacy bridge notification destination; tasks use their persisted group binding.
notify_chat_id = ""

[herdr]
# Empty uses herdr's socket discovery (HERDR_SOCKET_PATH / named session / default).
# A leading ~/ is expanded for the account running the service.
socket_path = ""
poll_interval = "1s"
call_timeout = "10s"

[ui]
# Literal loopback IP only. Port 0 chooses a free port and prints the actual URL.
# serve --config-listen / configure --listen override this address.
config_listen = "127.0.0.1:18790"
# Display clipping only; original screen/Guard/detection remain unchanged.
max_cols = 56
tail_lines = 18
# Task progress notifications coalesce to latest state during cooldown.
# Approval cards, final results and before-close notifications are not delayed.
notify_cooldown = "30s"

[mirror]
# Existing-agent compatibility mode only; managed task outputs use task receipts.
default_on = false

[tasks]
# Enable before setup to include task/group scopes in authorization.
enabled = false
# Applies to NEW task snapshots. true requests the executor's bypass mode.
bypass = true
default_project = ""
poll_interval = "30s"

# TOML seeds the catalog only before SQLite has one. Legacy projects.json,
# when present, replaces the TOML project list during initial loading.
# Later Web edits write the SQLite catalog, not these seed definitions.
# First directory is cwd; additional directories are passed separately.
# Explicit new projects are created under ~/herder-agent-code/<name>/.
# Default shared mode does not create a worktree; explicit task worktree mode does.
# [tasks.projects.example]
# directories = ["~/code/example", "~/code/shared-library"]
# agent = "codex"

[ai]
# Requires tasks.enabled=true. pi handles this tool's orchestration only.
# In AI mode the model decides conversations and tool calls; keyword branches
# and fixed business replies must not replace the model's decisions.
enabled = false
provider = "openai-responses" # or "anthropic-messages"
model = ""
base_url = "" # required when AI is enabled; version root, e.g. https://api.openai.com/v1
api_key = "" # model key is read from TOML; keep this file private
# HTTPS required except loopback HTTP; no credentials/query/fragment in URL.
# Changing model configuration requires service restart.
timeout = "2m"
context_tokens = 50000 # integer 16384..1048576; older context is summarized

[memory]
# Compatibility name "file" means SQLite local summary storage in this version.
# Full messages, tasks and receipts always remain local.
provider = "file" # or "http": POST /recall and /store
base_url = ""
api_key = "" # required for non-loopback HTTP provider hosts (HTTPS only)
timeout = "10s"
# Per-user overrides are complete, not inherited from global URL/key.
# [memory.users.ou_YOUR_OPEN_ID]
# provider = "file"

[runtime]
# Maximum simultaneous task reconciliations per batch, NOT total active agents.
max_concurrent_tasks = 4
# New tasks retain group history unless explicitly overridden.
# Migrated Go tasks preserve their original delete-group semantics.
group_retention = "delete" # default: dissolve group after completed; "retain" explicitly keeps it
