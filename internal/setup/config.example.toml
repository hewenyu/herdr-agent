# herdr-agent · example configuration
#
# Install to ~/.herdr-agent/config.toml (deploy/install.sh copies it there if
# that file does not exist yet) and edit `allowed_open_ids`. Every key below is
# shown with the value the bridge uses when the key is absent, so deleting a
# line changes nothing.
#
# Model credentials are configured as [ai].api_key below. Keep this file private
# (chmod 600 ~/.herdr-agent/config.toml) and redact api_key before sharing it.
# Feishu credentials still use setup / .env: FEISHU_APP_ID and FEISHU_APP_SECRET
# are read from the process environment or ~/.herdr-agent/.env (mode 0600).
# There are no TOML fields for them; writing `app_secret` here is a startup error.
#
# Unknown keys are rejected at startup. `allowed_open_id` (singular, a plausible
# typo) must not read as "the allowlist is empty" and lock you out of your own
# bridge, and it must certainly not read as "no allowlist configured".

[feishu]

# The authorization boundary of the entire product, so it gets the long comment.
#
# Anyone on this list can approve any command any agent on this Mac is asking to
# run. That is not an exaggeration of the threat model: the herdr socket has no
# authentication of its own and is protected only by its 0600 file mode, so
# reaching it is equivalent to a shell here (G10). The bridge is the thing that
# puts a door on that socket, and this list is the lock.
#
# Default deny, and an EMPTY list is a hard startup error BY DESIGN. Not a
# warning, not "allow everyone until configured": a bridge that fell back to
# allow-all would hand a shell to whoever found the bot, and the failure would
# look like everything working. Refusing to boot is the whole trade-off — you
# cannot start the product without having answered this question.
#
# Fill in your own Feishu open_id (it looks like ou_<32 hex chars>). One entry
# is the intended shape; v1 is a single-user tool.
#
# The id below is a PLACEHOLDER and grants nothing. An example allowlist must
# never ship a value that actually works: install.sh copies this file to
# ~/.herdr-agent/config.toml verbatim, so anything syntactically complete here
# is one `#` away from being live in someone else's config, and "the bot ignores
# me" is what they would notice — not "a stranger can drive my agents".
# Replace the whole string, do not uncomment it as it stands.
#
#   allowed_open_ids = ["ou_REPLACE_WITH_YOUR_OWN_OPEN_ID"]
allowed_open_ids = []

# Where proactive pushes go — the "this agent is blocked" cards, the "it
# finished" notes, the "its pane is gone" line. Usually your own p2p chat with
# the bot (oc_...); read it from the open-platform API explorer, or from the
# bridge's own log after you message the bot.
#
# It is read only from here, never from an incoming message: a runtime-settable
# destination would let anyone who can talk to the bot redirect your agents'
# screen contents — which include whatever command they were about to run — to
# themselves.
#
# Default "": no proactive pushes. You can still drive agents by messaging the
# bot, you just will not be told when one needs you, which gives up most of the
# point of the product.
notify_chat_id = ""

[herdr]

# Path to herdr's API socket.
#
# Default "": resolve exactly the way herdr's own CLI does — $HERDR_SOCKET_PATH,
# then $HERDR_SESSION=<name>, then ~/.config/herdr/herdr.sock. Leave it empty
# unless you run a named session; a hardcoded path here would keep pointing at
# the old socket after you switch sessions, and the bridge would report an
# empty machine rather than an error.
socket_path = ""

# How often `agent.list` is polled.
#
# The bridge polls instead of subscribing on purpose: herdr's
# pane.agent_status_changed subscription needs a concrete pane_id with no
# wildcard, its event ring silently overflows at 512, and a reconnect replays
# from sequence 0 — which on a phone is a notification storm (G10). herdr's own
# detector runs every 300ms, so polling at 1s costs at most a second of latency.
#
# Trade-off: lower is faster to notice a blocked agent, but every tick is a new
# connection and a round trip through herdr's single UI thread. Default "1s".
poll_interval = "1s"

# Deadline for one herdr call.
#
# herdr has NO server-side timeout and answers every request from one UI thread,
# so a modal dialog open on the desktop blocks your call forever (G10). Without
# a client deadline the bridge would hang, not degrade.
#
# Trade-off: too low turns a busy-but-healthy herdr into spurious failures and
# a "degraded" bridge; too high delays noticing that herdr is wedged.
# Default "10s".
call_timeout = "10s"

[ui]

# Address of the local project configuration page for both serve and configure.
# Change the port if it is in use, then restart. Only literal loopback IPs are
# accepted (127.0.0.1 or [::1]); 0 requests an available port printed at startup.
# CLI overrides: serve --config-listen IP:port, configure --listen IP:port.
# serve --no-config-ui disables the page. Default "127.0.0.1:18790".
config_listen = "127.0.0.1:18790"

# Column budget for screen text pushed to the phone.
#
# A pane that has ever had a terminal attached is typically 173 columns (G5).
# Lines are CROPPED to this width, never wrapped: wrapping a TUI destroys its
# alignment and makes the dialog unreadable. Cropping loses the right-hand side
# and says so on the card.
#
# Trade-off: wider keeps more of each line but forces the phone to scroll
# sideways. Default 56.
max_cols = 56

# How many lines of the visible viewport `/card` and the "finished" push show.
#
# Trade-off: more context per card versus a card you have to scroll to find the
# buttons on. Default 18.
tail_lines = 18

# Minimum gap between two pushes about the same pane. Transitions arriving
# inside the window are coalesced and the latest one is sent when it expires.
#
# Trade-off: an agent that flips blocked/working repeatedly can otherwise ring
# your phone continuously; a long cooldown delays the notification that
# actually matters. Idempotency is separate and unconditional — the same
# (pane, state_seq) is pushed once, ever. Default "30s".
notify_cooldown = "30s"

# Legacy compatibility field; accepted but no longer used.
# Prose uses the agent's own input handling; this application does not keep
# a deferred message queue. Changing this value does not enable or size a queue.
queue_limit = 5

[mirror]

# Mirror every agent's transcript into the chat without an explicit
# `/mirror <pane> on`.
#
# Default false: one chatty agent turns your chat with the bot into a firehose,
# and the takeover features (cards, replies) then scroll away. Turn mirroring on
# per agent, when you actually want to read along.
default_on = false

[tasks]

# Create Feishu tasks and a dedicated herdr workspace from a configured project.
# Opt in only after configuring the task and private-group permissions for the
# existing Feishu app. Existing installations keep their current behavior.
enabled = false

# Global mode for NEW agents: codex --dangerously-bypass-approvals-and-sandbox
# or claude --dangerously-skip-permissions. Defaults to true. Set false for normal
# execution approvals. The local page's Bypass checkbox persists an override.
bypass = true

# The default project for requests without a project name. Can stay empty while
# the catalog is empty. Names support letters (including Chinese), digits,
# hyphens and underscores, with no spaces, slashes or punctuation.
default_project = ""

# How often to reconcile completion and reopening from the Feishu task panel.
# Default "30s". This must be positive when tasks are enabled; "0s" is invalid.
poll_interval = "30s"

# Configure projects at ui.config_listen (default http://127.0.0.1:18790), or use
# `herdr-agent configure --open` before starting the bridge. Saves apply to new
# tasks immediately. The page and API are served locally by Go.
# The first save writes projects.json in the state directory; after that its
# complete project catalog, default project and bypass override this TOML seed.
# enabled and poll_interval still come from this file.
#
# One project can include several existing directories, including non-Git folders.
# The first is the working directory; the rest are passed as --add-dir to agents.
# ~/ is expanded to the home of the OS account running the bridge.
# Agent can be "codex" or "claude" and defaults to "codex" if omitted.
# An explicit new-project request creates ~/herder-agent-code/<project-name>/;
# a normal new task only reuses a configured project. The primary directory is
# initialized as a Git repository if needed; no worktree is created.
#
# [tasks.projects.herdr-agent]
# directories = ["~/code/github/herdr-agent", "~/code/github/herdr"]
# agent = "codex"
#
# [tasks.projects."另一个项目"]
# path = "~/code/another-project" # legacy single-directory form is supported
# agent = "claude"

[ai]

# Interpret natural-language requests in the entry bot chat using a model API.
# Requires tasks.enabled = true. Configure projects locally, or explicitly
# request a new project through the AI entry point.
enabled = false

# API protocol: "openai-responses" or "anthropic-messages". The selected model
# must support tool calls. base_url is the version root, for example
# https://api.openai.com/v1 or https://api.anthropic.com/v1, with no credentials,
# query parameters or fragment. Match model to your model service.
provider = "openai-responses"
model = ""
base_url = ""

# Model service API key; required when enabled. Read only from this TOML field.
# HERDR_AGENT_AI_API_KEY in the environment or .env is no longer read; migrate
# an existing model key here before restarting serve. Feishu credentials stay
# separate in setup / .env. Changing AI configuration requires a restart.
api_key = ""

# HTTPS is required except for loopback HTTP model endpoints. timeout must be
# positive and no longer than 10 minutes; explicit "0s" is invalid.
timeout = "2m"

# Input context limit and automatic compaction threshold. Keep another 4096
# tokens available for model output within the selected model's actual window.
# Valid range: 16384..1048576; default 50000. Entry chats and task groups retain
# recent conversation and automatically summarize older history before it fills.
# UTF-8 bytes and message/tool overhead are counted conservatively; oversized
# messages or tool results stop safely before another model request is sent.
context_tokens = 50000

# Entry private chats use AI tools for task creation and overviews; task groups
# use AI tools for bound-task feedback, progress and acceptance.
# This Go service needs no JavaScript runtime or inbound URL.

[memory]

# Conversation summary storage, independent of [ai]'s model API. The default
# file provider stores summaries in ~/.herdr-agent/memory/. Recent original
# dialogue, checkpoints, archives and operation/message receipts remain local.
# After switching providers, local checkpoint summaries sync to the new store
# on the next turn using memory; old provider data and original dialogue are
# not automatically migrated or deleted.
# "http" uses a compatible conversation-storage service (see integration docs),
# not an OpenAI/Anthropic endpoint. Failure never silently switches to another
# provider or discards existing history.
provider = "file"

# For HTTP storage, configure its API root and optional path prefix. HTTPS is
# required except on loopback. Remote hosts require an API key; an unauthenticated
# loopback service is allowed. Keys are read only from TOML and never from env.
base_url = ""
api_key = ""

# HTTP storage request timeout, positive and no longer than 2 minutes.
timeout = "10s"

# Complete overrides by Feishu open_id. Each override uses independent default
# values (file, empty URL/key, 10s); it never inherits another user's or the
# global provider's endpoint/credentials. Users without overrides use [memory].
#
# [memory.users."ou_REPLACE_WITH_YOUR_OWN_OPEN_ID"]
# provider = "http"
# base_url = "https://memory.example.com/api"
# api_key = "REPLACE_WITH_STORAGE_KEY"
# timeout = "10s"
