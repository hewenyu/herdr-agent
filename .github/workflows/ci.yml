name: ci
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check and SEA · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin_arm64
            platform: darwin
            arch: arm64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
            platform: linux
            arch: arm64
          - runner: ubuntu-22.04
            target: linux_amd64
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.13.0
          cache: npm
      - name: Verify native build target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if(process.platform!==process.env.EXPECTED_PLATFORM||process.arch!==process.env.EXPECTED_ARCH)process.exit(1)'
      - run: npm ci
      - run: npm run check
      - name: Build and exercise standalone executable
        env:
          VERSION: v0.0.0-ci
          COMMIT: ci0000000000
          BUILD_DATE: '2026-01-01T00:00:00Z'
        run: |
          npm run binary
          npm run smoke
