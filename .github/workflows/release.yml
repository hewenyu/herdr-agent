# Release herdr-agent on a pushed v* tag.
#
# Three targets and no more: macOS on Apple Silicon, and Linux on arm64 and
# x86_64. There is deliberately no darwin/amd64 and no windows target — the
# product is measured on Apple Silicon and runs as a service on Linux, and an
# asset nobody tested is a support request waiting to happen.
#
# The version comes from the tag and from nowhere else. There is no fallback that
# invents one: an unstamped build reports "dev", which is the honest answer.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: build, package and publish
    runs-on: ubuntu-latest
    permissions:
      # The whole write scope this workflow needs: create the release and attach
      # assets to it. No packages, no id-token, no pull-requests.
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The tag is the version, so a tag that is not a version must stop here
      # rather than produce assets whose names lie about what they contain.
      - name: read the version out of the tag
        id: v
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $tag is not vMAJOR.MINOR.PATCH[-prerelease]; nothing was released"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "commit=$GITHUB_SHA"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # A tag with a prerelease part is published as a prerelease, so it
            # does not become the "latest release" people land on.
            if [[ "$tag" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >>"$GITHUB_OUTPUT"

      # One loop, one set of flags, three targets:
      #   CGO_ENABLED=0  static, and the only way three targets build from one
      #                  runner. Every dependency is pure Go.
      #   -trimpath      keeps the builder's absolute paths out of the binary.
      # DWARF is deliberately NOT stripped (-s -w): this product fails silently
      # by nature, and 4 MB is a poor trade for being unable to debug a binary
      # somebody downloaded. Panic traces stay readable either way.
      - name: build and package
        env:
          VERSION: ${{ steps.v.outputs.tag }}
          COMMIT: ${{ steps.v.outputs.commit }}
          DATE: ${{ steps.v.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 linux/arm64 linux/amd64; do
            os=${target%/*}
            arch=${target#*/}
            stage="build/${os}_${arch}"
            mkdir -p "$stage"

            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-X main.buildVersion=$VERSION -X main.buildCommit=$COMMIT -X main.buildDate=$DATE" \
              -o "$stage/herdr-agent" ./cmd/herdr-agent

            # Two things that are silent when they go wrong, so both are checked
            # per target rather than assumed from the loop:
            #   1. the binary is for the platform its name will claim
            #   2. -X actually reached a variable that exists. A -X naming a
            #      symbol that was renamed is ignored by the linker without any
            #      diagnostic, and every asset would report "dev".
            settings=$(go version -m "$stage/herdr-agent")
            for want in "GOOS=$os" "GOARCH=$arch" "CGO_ENABLED=0"; do
              case "$settings" in
                *"$want"*) ;;
                *) echo "::error::$stage/herdr-agent does not report $want"; exit 1 ;;
              esac
            done
            if ! grep -qa -- "$VERSION" "$stage/herdr-agent"; then
              echo "::error::$VERSION is not in the $os/$arch binary: -ldflags -X did not reach main.buildVersion"
              exit 1
            fi

            cp README.md LICENSE "$stage/"
            tar -czf "dist/herdr-agent_${VERSION}_${os}_${arch}.tar.gz" \
              -C "$stage" herdr-agent README.md LICENSE
          done

          # End to end on the one target this runner can execute: the binary is
          # asked what it is, and has to answer with the tag.
          out=$(./build/linux_amd64/herdr-agent version)
          echo "$out"
          for want in "$VERSION" "$COMMIT" "$DATE"; do
            case "$out" in
              *"$want"*) ;;
              *) echo "::error::the built binary does not report $want"; exit 1 ;;
            esac
          done

          # One file covering every archive, in the format both `sha256sum -c`
          # and macOS `shasum -a 256 -c` read.
          (cd dist && sha256sum herdr-agent_*.tar.gz >SHA256SUMS)
          cat dist/SHA256SUMS

      # Written with a quoted heredoc and a placeholder: an unquoted one would
      # run every `command` in backticks below as a command substitution.
      - name: write the release notes
        env:
          TAG: ${{ steps.v.outputs.tag }}
          COMMIT: ${{ steps.v.outputs.commit }}
        run: |
          set -euo pipefail
          cat >notes.in <<'MD'
          Download the archive for your machine from the Assets table below, unpack it, and run
          two commands:

              tar xzf herdr-agent___TAG___<os>_<arch>.tar.gz    # the name you downloaded

              ./herdr-agent setup    # register the Feishu app and prove it works end to end
              ./herdr-agent serve    # run the bridge, then message the bot /ls from your phone

          `./herdr-agent doctor` checks this machine for the things that silently break the
          bridge if either of those does not do what you expected, and `./herdr-agent version`
          says exactly which build you are running.

          ### Verify what you downloaded

              shasum -a 256 --ignore-missing -c SHA256SUMS   # macOS
              sha256sum --ignore-missing -c SHA256SUMS       # Linux

          SHA256SUMS covers all three archives, and `--ignore-missing` is what lets it verify the
          one you downloaded instead of failing on the two you did not. Both tools take that flag.
          The line for your own file has to say OK, and the exit status has to be 0. Without the
          flag the two absent archives are reported as FAILED and the exit status is non-zero,
          which is expected but tells you nothing.

          ### macOS: these binaries are not signed and not notarised

          There is no Apple Developer signature and no notarisation on any asset here. macOS
          attaches a quarantine flag to anything a browser downloads, so the binary is refused
          with "cannot be opened because the developer cannot be verified". Clear the flag
          yourself:

              xattr -d com.apple.quarantine ./herdr-agent

          It prints `No such xattr` if the flag was never set — downloading with curl or wget
          does not set one — and that is fine. Nothing here is signed either way.

          ### Assets

          | archive | machine |
          | --- | --- |
          | `herdr-agent___TAG___darwin_arm64.tar.gz` | macOS, Apple Silicon |
          | `herdr-agent___TAG___linux_arm64.tar.gz` | Linux, arm64 |
          | `herdr-agent___TAG___linux_amd64.tar.gz` | Linux, x86_64 |

          Each archive holds the binary, README.md and LICENSE, and nothing else. The service
          units are not in it: they live in the git repository, at
          https://github.com/hewenyu/herdr-agent/tree/__TAG__/deploy — Linux users want the
          systemd user unit `herdr-agent.service` there, plus `herdr-server.service`, because the
          herdr server needs the scrubbed environment that one sets up. Read the comment at the
          top of each before starting anything.

          Built from __COMMIT__.
          MD
          sed "s|__TAG__|$TAG|g; s|__COMMIT__|$COMMIT|g" notes.in >notes.md
          cat notes.md

      # gh is preinstalled on the runner, so there is no third-party action here
      # to pin, review or trust. --verify-tag refuses to invent a tag that is not
      # already on the remote.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "herdr-agent $TAG" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" dist/herdr-agent_*.tar.gz dist/SHA256SUMS
